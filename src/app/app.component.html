
<RadSideDrawer [drawerTransition]="sideDrawerTransition">

  <GridLayout
    tkDrawerContent
    rows="auto, *, auto"
    class="inventario-drawer">

    <!-- Encabezado del menú -->

    <StackLayout
      row="0"
      class="inventario-drawer-header">

      <GridLayout class="inventario-logo-container">

        <Label
          class="fas inventario-logo"
          text="&#xf466;">
        </Label>

      </GridLayout>

      <Label
        class="inventario-brand"
        text="InventarioApp">
      </Label>

      <Label
        class="inventario-description"
        text="Sistema de gestión de inventario"
        textWrap="true">
      </Label>

    </StackLayout>

    <!-- Opciones del menú -->

    <ScrollView
      row="1"
      class="inventario-drawer-body">

      <StackLayout>

        <Label
          class="inventario-section-title"
          text="MENÚ PRINCIPAL">
        </Label>

        <!-- Inicio -->

        <GridLayout
          columns="36, *, 5"
          class="inventario-menu-item"
          [class.menu-selected]="isComponentSelected('/home')"
          (tap)="onNavItemTap('/home')">

          <Label
            col="0"
            text="&#xf015;"
            class="fas inventario-menu-icon">
          </Label>

          <Label
            col="1"
            text="Inicio"
            class="inventario-menu-label">
          </Label>

          <StackLayout
            col="2"
            class="inventario-selection-indicator">
          </StackLayout>

        </GridLayout>

        <!-- Productos -->

        <GridLayout
          columns="36, *, 5"
          class="inventario-menu-item"
          [class.menu-selected]="isComponentSelected('/browse')"
          (tap)="onNavItemTap('/browse')">

          <Label
            col="0"
            text="&#xf466;"
            class="fas inventario-menu-icon">
          </Label>

          <Label
            col="1"
            text="Productos"
            class="inventario-menu-label">
          </Label>

          <StackLayout
            col="2"
            class="inventario-selection-indicator">
          </StackLayout>

        </GridLayout>

        <!-- Buscar productos -->

        <GridLayout
          columns="36, *, 5"
          class="inventario-menu-item"
          [class.menu-selected]="isComponentSelected('/search')"
          (tap)="onNavItemTap('/search')">

          <Label
            col="0"
            text="&#xf002;"
            class="fas inventario-menu-icon">
          </Label>

          <Label
            col="1"
            text="Buscar productos"
            class="inventario-menu-label">
          </Label>

          <StackLayout
            col="2"
            class="inventario-selection-indicator">
          </StackLayout>

        </GridLayout>

        <!-- Productos destacados -->

        <GridLayout
          columns="36, *, 5"
          class="inventario-menu-item"
          [class.menu-selected]="isComponentSelected('/featured')"
          (tap)="onNavItemTap('/featured')">

          <Label
            col="0"
            text="&#xf005;"
            class="fas inventario-menu-icon">
          </Label>

          <Label
            col="1"
            text="Destacados"
            class="inventario-menu-label">
          </Label>

          <StackLayout
            col="2"
            class="inventario-selection-indicator">
          </StackLayout>

        </GridLayout>

        <!-- Separador -->

        <StackLayout class="inventario-divider">
        </StackLayout>

        <Label
          class="inventario-section-title"
          text="SISTEMA">
        </Label>

        <!-- Configuración -->

        <GridLayout
          columns="36, *, 5"
          class="inventario-menu-item"
          [class.menu-selected]="isComponentSelected('/settings')"
          (tap)="onNavItemTap('/settings')">

          <Label
            col="0"
            text="&#xf013;"
            class="fas inventario-menu-icon">
          </Label>

          <Label
            col="1"
            text="Configuración"
            class="inventario-menu-label">
          </Label>

          <StackLayout
            col="2"
            class="inventario-selection-indicator">
          </StackLayout>

        </GridLayout>

      </StackLayout>

    </ScrollView>

    <!-- Pie del menú -->

    <StackLayout
      row="2"
      class="inventario-drawer-footer">

      <Label
        class="inventario-footer-brand"
        text="InventarioApp">
      </Label>

      <Label
        class="inventario-footer-version"
        text="Versión 1.0.0">
      </Label>

      <Label
        class="inventario-footer-technology"
        text="NativeScript + Angular">
      </Label>

    </StackLayout>

  </GridLayout>

  <!-- Contenido principal de la aplicación -->

  <GridLayout tkMainContent>

    <page-router-outlet></page-router-outlet>

  </GridLayout>

</RadSideDrawer>
